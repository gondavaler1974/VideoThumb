[Performance]
; In-memory LRU cache. TC may also use its own persistent thumbnail database.
CacheMB=96
CacheEntries=256

; Conservative defaults for the i7-920 + SMB share.
MaxParallel=2
DecoderThreads=2

; Abort stuck FFmpeg/libav I/O.
TimeoutMs=12000
PacketLimit=5000

[Thumbnail]
; First representative video frame position. 1000 = 1 second.
SeekMs=1000

; If the first sampled frame is almost black, retry later positions.
; The dark-pixel test samples only 1/16 of thumbnail pixels, so normal videos
; pay negligible CPU cost; extra seeks happen only for nearly-black frames.
BlackFrameDetection=1
BlackThreshold=20
BlackPixelPercent=95

; Detect sparse text/logo cards on a black background which are not 95% black.
; This is still only a cheap scan of the already-created thumbnail.
TitleCardDetection=1
TitleCardDarkPercent=70
TitleCardMidtoneMaxPercent=20
TitleCardMeanLumaMax=70

; Reject flat/near-flat frames of ANY color (black, white, gray, colored cards).
; The coarse dominant-color test also catches sparse text on a flat background.
UniformFrameDetection=1
MaxLumaStdDev=18
MaxColorStdDev=16
DominantColorPercent=82

; Reject smooth fade/gradient transition frames with very little local detail.
; Edge/gradient statistics are measured only on the already-small thumbnail.
TransitionDetection=1
MinEdgePercent=2
EdgeThreshold=20
MaxMeanGradient=7

FallbackSeekMs=3000,5000,10000

; Final retry at this percentage of the video's duration. 0 disables it.
FallbackPercent=10

[ZipSequence]
; If a file such as .mp4 is really a ZIP of images, use its naturally-first
; decodable image as the thumbnail. Normal videos do not pay this cost.
Enabled=1

; Security/resource guards for archive entries and WIC image decode.
MaxEntryMB=64
MaxCandidates=16
MaxSourceMP=100

[Compatibility]
; Direct libav already handles the tested D:\Downloads\Finny -> UNC symlink.
; Enabling this restores the old GetFinalPathNameByHandle retry, but CreateFileW
; on a dead SMB target does not have our libav interrupt timeout.
ResolveSymlinkFallback=0
